                    <section
                        id="proposta"
                        class="codex__section"
                        aria-labelledby="purpose-title"
                    >
                        <span class="section-eyebrow">01 / Visão geral</span>
                        <h2 id="purpose-title">
                            Do achado isolado à avaliação do repositório.
                        </h2>
                        <p>
                            O Codex organiza sinais de lint, segurança,
                            complexidade, testes e documentação em uma avaliação
                            de 0 a 1000, acompanhada de um relatório. A nota
                            sintetiza o resultado; os achados e as recomendações
                            oferecem contexto para a revisão humana. Não é uma
                            certificação de qualidade.
                        </p>
                    </section>
                    <section
                        id="funcionalidades"
                        class="codex__section"
                        aria-labelledby="features-title"
                    >
                        <span class="section-eyebrow"
                            >02 / Funcionalidades</span
                        >
                        <h2 id="features-title">Recursos implementados.</h2>
                        <ul class="codex__list">
                            <li>
                                Autenticação com GitHub e seleção de
                                repositórios; endpoint da API para análise de
                                URL pública sem login.
                            </li>
                            <li>
                                Análise estática por linguagem e revisão
                                opcional com Gemini, Claude ou OpenRouter.
                            </li>
                            <li>
                                Progresso por SSE, com alternativa de
                                acompanhamento por polling.
                            </li>
                            <li>
                                Relatório com score, indicadores de qualidade e
                                achados filtráveis por origem e severidade.
                            </li>
                            <li>
                                Comparação entre base e head de pull requests.
                            </li>
                            <li>
                                Histórico e cache por commit com PostgreSQL
                                configurado; reanálise de pushes em repositórios
                                públicos por webhook configurado.
                            </li>
                        </ul>
                    </section>
                    <section
                        id="pipeline"
                        class="codex__section"
                        aria-labelledby="pipeline-title"
                    >
                        <span class="section-eyebrow">03 / Funcionamento</span>
                        <h2 id="pipeline-title">
                            Do repositório ao relatório.
                        </h2>
                        <ol class="codex__steps">
                            <li>
                                <h3>Preparar</h3>
                                <p>
                                    O pedido entra na fila. O backend faz a
                                    verificação de tamanho, clona o repositório
                                    temporariamente e consulta o cache pelo
                                    commit.
                                </p>
                            </li>
                            <li>
                                <h3>Analisar</h3>
                                <p>
                                    As ferramentas estáticas produzem achados e
                                    métricas; os metadados são consultados na
                                    API do GitHub.
                                </p>
                            </li>
                            <li>
                                <h3>Revisar</h3>
                                <p>
                                    Quando habilitada, a IA recebe métricas e
                                    amostras de código para elaborar a revisão
                                    qualitativa.
                                </p>
                            </li>
                            <li>
                                <h3>Apresentar</h3>
                                <p>
                                    O frontend exibe o relatório. A nota híbrida
                                    combina 40% da análise estática e 60% da
                                    revisão; sem IA, usa a nota estática.
                                </p>
                            </li>
                        </ol>
                    </section>
                    <section
                        id="engenharia"
                        class="codex__section"
                        aria-labelledby="engineering-title"
                    >
                        <span class="section-eyebrow"
                            >04 / Arquitetura e tecnologias</span
                        >
                        <h2 id="engineering-title">
                            Interface, processamento e persistência.
                        </h2>
                        <div class="codex__cards">
                            <article class="codex__card">
                                <h3>Frontend</h3>
                                <p>
                                    Next.js 15, React 19, TypeScript, Tailwind
                                    CSS e ícones lucide-react. Interface para
                                    repositórios, jobs, relatórios e
                                    comparações.
                                </p>
                            </article>
                            <article class="codex__card">
                                <h3>Backend</h3>
                                <p>
                                    Python, FastAPI, Uvicorn, httpx e asyncio.
                                    Análise com ruff, bandit e radon para
                                    Python, Biome para JavaScript/TypeScript e
                                    golangci-lint para Go quando disponível.
                                </p>
                            </article>
                            <article class="codex__card">
                                <h3>Integrações</h3>
                                <p>
                                    GitHub OAuth e REST API, provedores de IA
                                    opcionais e PostgreSQL com asyncpg. Docker
                                    Compose organiza frontend, backend e banco.
                                </p>
                            </article>
                        </div>
                        <p class="codex__note">
                            Tokens ficam no servidor e os clones temporários são
                            removidos após o processamento. Sessões e jobs são
                            mantidos em memória; sem banco, não há persistência
                            de histórico ou cache. Ferramentas ausentes são
                            sinalizadas no resultado.
                        </p>
                    </section>
