<!doctype html>
<html lang="pt-BR" data-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- ── SEO primário ───────────────────────────────────────────
          As fichas `__ROTA_*__` são preenchidas por rota em
          `rotaHtmlPlugin` (vite.config.ts). Cada rota é servida por um
          documento próprio, então título, descrição e canônica chegam
          certos no HTML — antes, vinham os da home para todo mundo e só
          o `useDocumentMeta` corrigia, depois do JavaScript. -->
        <title>__ROTA_TITULO__</title>
        <meta name="description" content="__ROTA_DESCRICAO__" />
        <meta name="author" content="Guilherme Cruz" />
        <meta name="robots" content="index, follow" />
        <link rel="canonical" href="__SITE_URL____ROTA_CAMINHO__" />

        <!-- Notas de versão em Atom; leitores de feed descobrem por aqui. -->
        <link
            rel="alternate"
            type="application/atom+xml"
            title="Notas de versão"
            href="__SITE_URL__/feed.xml"
        />

        <!-- ── Open Graph ───────────────────────────────────────────── -->
        <meta property="og:type" content="website" />
        <meta property="og:url" content="__SITE_URL____ROTA_CAMINHO__" />
        <meta property="og:site_name" content="Guilherme Cruz — Portfolio" />
        <meta property="og:locale" content="pt_BR" />
        <meta property="og:locale:alternate" content="en_US" />
        <meta property="og:title" content="__ROTA_TITULO_CURTO__" />
        <meta property="og:description" content="__ROTA_RESUMO__" />
        <meta property="og:image" content="__SITE_URL__/og-preview.jpg" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:image:alt" content="__ROTA_TITULO_CURTO__" />

        <!-- ── Twitter Cards ────────────────────────────────────────── -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="__ROTA_TITULO_CURTO__" />
        <meta name="twitter:description" content="__ROTA_RESUMO__" />
        <meta name="twitter:image" content="__SITE_URL__/og-preview.jpg" />

        <meta name="theme-color" content="#040710" />

        <!-- ── Favicons / PWA ───────────────────────────────────────── -->
        <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
        <link rel="icon" href="/favicon.ico" sizes="32x32" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <link rel="manifest" href="/manifest.webmanifest" />

        <!-- ── Fontes ───────────────────────────────────────────────── -->
        <!--
          Fora do caminho crítico, de propósito.

          Como <link rel="stylesheet"> comum, estas duas folhas seguravam a
          PRIMEIRA PINTURA até dois hosts de terceiros responderem — dois DNS,
          dois TLS, antes de qualquer pixel. Medido: com 1,2s de atraso nos
          CDNs, a tela ficava branca por 1.576ms; sem esperá-los, pinta em
          400ms. O atraso do terceiro entrava um a um no tempo de tela branca.

          `media="print"` faz o navegador buscar sem bloquear a pintura; o
          onload devolve para `all` assim que chega. O <noscript> cobre quem
          não roda JavaScript, e aí bloquear é o comportamento correto.

          A troca de fonte aparece — mas já aparecia: as três famílias usam
          `display=swap` e todas têm pilha de sistema em tokens.css. A escolha
          é entre ver o texto na fonte de sistema por um instante ou não ver
          texto nenhum.
        -->
        <!-- Sem `crossorigin`: este host serve a FOLHA, buscada por um
          <link rel="stylesheet"> comum, que não é requisição CORS. Um
          preconnect com o atributo abre a conexão em modo CORS, que a folha
          não reaproveita — o navegador abre uma segunda para o mesmo host e o
          Lighthouse marca a primeira como "pré-conexão não usada". O par do
          Google logo abaixo sempre esteve certo: googleapis (CSS) sem o
          atributo, gstatic (fontes) com ele. Aqui o `crossorigin` do host de
          fontes tinha sido copiado para o host de CSS. -->
        <link rel="preconnect" href="https://api.fontshare.com" />
        <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
        <link
            href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@500,600,700&f[]=general-sans@400,500,600&display=swap"
            rel="stylesheet"
            media="print"
            onload="this.media = 'all'"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
            rel="stylesheet"
            media="print"
            onload="this.media = 'all'"
        />
        <noscript>
            <link
                href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@500,600,700&f[]=general-sans@400,500,600&display=swap"
                rel="stylesheet"
            />
            <link
                href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
                rel="stylesheet"
            />
        </noscript>

        <!-- ── CDN externo usado nos ícones de tecnologia ─────────────
          `dns-prefetch`, e não `preconnect`. O Lighthouse avisa a partir de
          quatro preconnects, e com razão: cada um segura um par de DNS+TLS no
          caminho crítico. Estes ícones aparecem em Sobre, Destaque e Formações
          — nenhum acima da dobra —, então adiantar o handshake tira lugar de
          quem é necessário para a primeira tela. Resolver o nome antes é de
          graça e continua ajudando quando a vez deles chegar. -->
        <link rel="dns-prefetch" href="https://skillicons.dev" />

        <!-- ── Structured Data (JSON-LD) ────────────────────────────── -->
        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "Person",
                "name": "Guilherme Cruz",
                "url": "__SITE_URL__/",
                "image": "__SITE_URL__/og-preview.jpg",
                "jobTitle": "Desenvolvedor Full Stack",
                "worksFor": {
                    "@type": "Organization",
                    "name": "Wise System",
                    "description": "Software de SST (Saúde e Segurança do Trabalho) e gestão ocupacional — SIGO"
                },
                "address": {
                    "@type": "PostalAddress",
                    "addressLocality": "São Paulo",
                    "addressRegion": "SP",
                    "addressCountry": "BR"
                },
                "sameAs": [
                    "https://github.com/https-shini",
                    "https://linkedin.com/in/oguilherme-cruz"
                ],
                "knowsAbout": [
                    "React",
                    "TypeScript",
                    "JavaScript",
                    "Node.js",
                    "Python",
                    "SQL",
                    "eSocial",
                    "SST"
                ]
            }
        </script>

        <!-- Tema inline — evita flash (FOUC) antes do React montar -->
        <script>
            (function () {
                var saved = localStorage.getItem("portfolio-theme");
                var dark =
                    saved === "dark" ||
                    (!saved &&
                        window.matchMedia("(prefers-color-scheme: dark)")
                            .matches);
                var theme = dark ? "dark" : "light";
                document.documentElement.setAttribute("data-theme", theme);
                document.documentElement.style.colorScheme = theme;
                document.addEventListener("DOMContentLoaded", function () {
                    document.body.classList.toggle("dark-mode", dark);
                    document.body.classList.toggle("light-mode", !dark);
                });
            })();
        </script>
    </head>
    <body class="dark-mode">
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
