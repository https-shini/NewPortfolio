<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Variante mínima da marca <gcruz.dev/>: nas abas o SVG rende a
       16-32px, onde os colchetes virariam borrão — ficam as letras, no
       peso que a análise da marca validou. Fonte de sistema de
       propósito: favicon SVG não carrega webfont, e o monospace local é
       o mesmo compromisso do favicon anterior (que usava Arial). -->
  <rect width="64" height="64" rx="14" fill="#070d19"/>
  <text x="32" y="34" text-anchor="middle" dominant-baseline="central"
        font-family="ui-monospace, 'Cascadia Mono', 'Segoe UI Mono', Menlo, monospace"
        font-weight="700" font-size="34" fill="#f8fafc">gc</text>
</svg>
