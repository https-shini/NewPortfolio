# Empacotamento do app desktop.
#
# O `dist/` do site NÃO mora dentro deste pacote: ele é produzido por
# `apps/web` e copiado para os recursos do app no empacotamento. Uma
# fonte só para a interface, nas três plataformas e na web.

# Com npm workspaces o pacote do electron fica içado para o node_modules
# da RAIZ, e o electron-builder o procura em apps/desktop/node_modules.
# Declarar a versão aqui é o que o desacopla de onde o pacote foi parar.
electronVersion: 33.4.11

appId: br.dev.gcruz.portfolio
productName: Portfolio Guilherme Cruz
copyright: Copyright © 2026 Guilherme Cruz

# Não há dependência nativa aqui: o app é HTML servido de um protocolo
# próprio. Sem isto o builder dispara um `npm install` só para recompilar
# binários que não existem, e esse install esbarra no `prepare: husky` da
# raiz, que não resolve dentro do subprocesso dele.
npmRebuild: false

directories:
    output: release
    buildResources: build

# Só o que o app executa. Sem isto o electron-builder arrastaria o
# workspace inteiro — incluindo o node_modules do site, que não roda aqui.
files:
    - src/**/*
    - package.json

# O build do site entra como recurso, e é de lá que o protocolo `app://`
# serve os arquivos (ver RAIZ_WEB em src/main.js).
extraResources:
    - from: ../web/dist
      to: web

# Nome previsível, e sem espaço.
#
# O padrão é `${productName}-${version}.${ext}` — "Portfolio Guilherme
# Cruz-2.1.0.AppImage". O espaço vira %20 na URL, e a action de release
# trocou os espaços por pontos ao publicar: o `latest-linux.yml` passou a
# apontar para um nome que não existe na release, e a atualização
# automática buscaria um arquivo inexistente.
#
# De quebra a arquitetura entra no nome, que é de onde a /downloads a lê:
# antes só o .deb a revelava, e o .exe e o AppImage apareciam sem selo.
artifactName: ${name}-${version}-${os}-${arch}.${ext}

# A atualização automática NÃO pode ler as releases do GitHub: o
# repositório é privado, e um app distribuído não tem como carregar um
# token para se autenticar. O provedor genérico aponta para o próprio
# site, onde /atualizacao/<arquivo> é reescrito para /api/baixar — a
# mesma porta por onde a página entrega os instaladores.
publish:
    provider: generic
    url: https://gcruz.dev.br/atualizacao

# O mesmo ícone do site, não uma cópia dele. Sem `icon` o electron-builder
# empacota o ícone padrão do Electron — o app instalado apareceria no menu
# e na barra de tarefas como "Electron" genérico. O 512x512 é o tamanho de
# origem que o builder pede para derivar .ico e .icns sozinho.
linux:
    icon: ../web/public/icon-512.png
    target:
        - AppImage
        - deb
    category: Development
    synopsis: Portfólio de Guilherme Cruz
    desktop:
        StartupWMClass: portfolio-desktop

win:
    icon: ../web/public/icon-512.png
    target:
        - target: nsis
          arch: [x64]

nsis:
    oneClick: false
    perMachine: false
    allowToChangeInstallationDirectory: true
    # Sem certificado de assinatura, o SmartScreen avisa no primeiro uso.
    # Não bloqueia a instalação; é o item que depende de compra.

mac:
    icon: ../web/public/icon-512.png
    target:
        - target: dmg
          arch: [x64, arm64]
    category: public.app-category.developer-tools
