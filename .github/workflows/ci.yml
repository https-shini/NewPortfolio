name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Type-check · Test · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # Um `npm ci` só: os workspaces instalam a raiz e apps/web juntos.
      # As funções em api/ resolvem dependências pela raiz e a suíte inclui
      # os testes delas, então `@vercel/og` precisa estar presente.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      # Não redesenha nada: confere a assinatura do icon.svg gravada na
      # última geração. Editar a fonte e esquecer de regenerar deixaria o
      # executável, o instalador e a aba do site com desenhos diferentes.
      - name: Ícones em dia com a fonte
        run: npm run icones:check

      # Mesmo arranjo: confere a assinatura das fotos de origem. Trocar a
      # foto sem regenerar deixaria as variantes mostrando a antiga.
      - name: Variantes de imagem em dia com as fotos
        run: npm run imagens:check

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: apps/web/dist
          retention-days: 7

  # As auditorias consomem o dist/ que o job acima publicou, em vez de
  # construir de novo: o que se mede passa a ser exatamente o artefato que
  # seria publicado.
  audit:
    name: Acessibilidade · Rolagem · Orçamento
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        # `--workspaces=false` mantém o job enxuto: os arranjos precisam
        # de playwright e axe-core, não do app inteiro.
        run: npm install --ignore-scripts --no-audit --no-fund --workspaces=false

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install system deps for cached Chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: apps/web/dist

      - name: Serve the build
        # O vite preview exige o app instalado; um servidor estático
        # entrega o mesmo dist/ sem esse custo. O SPA precisa que toda rota
        # desconhecida caia no index.html.
        run: npx --yes serve@14 -s apps/web/dist -l 4173 &

      - name: Wait for the server
        run: npx --yes wait-on@7 http://localhost:4173 --timeout 60000

      - name: Accessibility (axe-core)
        env:
          BASE_URL: http://localhost:4173
        run: npm run audit:a11y

      - name: Horizontal overflow
        env:
          BASE_URL: http://localhost:4173
        run: npm run audit:overflow

      - name: Camadas da atmosfera
        env:
          BASE_URL: http://localhost:4173
        run: npm run audit:layers

      - name: Identidade visual das superfícies
        env:
          BASE_URL: http://localhost:4173
        run: npm run audit:identity

      - name: Release notes end-to-end
        env:
          BASE_URL: http://localhost:4173
        run: npm run audit:release-notes

      - name: Overlays (scroll lock, inert background)
        env:
          BASE_URL: http://localhost:4173
        run: npm run audit:modals

      - name: Bundle budget
        run: npm run audit:bundle
